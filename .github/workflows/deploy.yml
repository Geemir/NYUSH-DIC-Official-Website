# Builds the Next.js static export and deploys it to GitHub Pages.
# Replaces the previous Jekyll workflow.
#
# Pull requests get the same lint + build as a check, without deploying.
name: Build and deploy

on:
  push:
    branches: ["main"]
  pull_request:
  # Lets you redeploy by hand from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel one that is already running.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'pages' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure Pages
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build static export
        run: npm run build
        env:
          # From Pages on deploy ("/NYUSH-DIC-Official-Website" on github.io,
          # empty on a custom domain); the repo sub-path for PR checks.
          NEXT_PUBLIC_BASE_PATH: ${{ github.event_name == 'pull_request' && format('/{0}', github.event.repository.name) || steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ github.event_name == 'pull_request' && format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) || steps.pages.outputs.base_url }}

      # The client router prefetches per-segment files named like
      # `__next.$d$locale.__PAGE__.txt`. Fail loudly if a Next upgrade ever
      # stops emitting them, rather than shipping a site full of 404s.
      - name: Check prefetch files
        run: ls out/en/ | grep -q '^__next\..*__PAGE__\.txt$'

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
