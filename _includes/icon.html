{%- comment -%}
  Small inline icons, drawn for this site so pages don't need an icon font.
  They take the text colour and size (1em).

    {% include icon.html name="instagram" %}   (also: wechat, linkedin)
{%- endcomment -%}
<svg class="dic-icon dic-icon--{{ include.name }}" viewBox="0 0 24 24" width="1em" height="1em" aria-hidden="true" focusable="false">
{%- case include.name -%}
{%- when "instagram" -%}
<g fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/></g><circle cx="17.2" cy="6.8" r="1.25" fill="currentColor"/>
{%- when "wechat" -%}
<g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M7.7 15.33A7.4 6.2 0 0 1 6.27 14.92L3.3 17.4l.43-4.11A7.4 6.2 0 1 1 16.64 8.02"/><path d="M18.54 19.83A6 5 0 1 1 20.6 18.51l.9 2.9z"/></g><g fill="currentColor"><circle cx="6.8" cy="7.8" r="1.05"/><circle cx="11.6" cy="7.8" r="1.05"/><circle cx="14" cy="14.4" r=".85"/><circle cx="18" cy="14.4" r=".85"/></g>
{%- when "linkedin" -%}
<rect x="3" y="3" width="18" height="18" rx="2.5" fill="none" stroke="currentColor" stroke-width="2"/><g fill="currentColor"><rect x="7" y="10" width="2.2" height="7"/><circle cx="8.1" cy="7.2" r="1.3"/></g><path d="M12.3 17v-7m0 3.4a2.9 2.9 0 0 1 5.8 0V17" fill="none" stroke="currentColor" stroke-width="2.2"/>
{%- endcase -%}
</svg>
